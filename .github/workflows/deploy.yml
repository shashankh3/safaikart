name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies (Root)
        run: npm ci

      - name: Type Check & Unit Tests
        run: |
          npm run test:all

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Test Firestore Rules (Emulators)
        run: npm run test:rules

      # Assuming Google Service Account is configured
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Dry Run Deploy (Indexes & Rules)
        uses: w9jds/firebase-action@v13.0.1
        with:
          args: deploy --only firestore --dry-run
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: default

      - name: Install functions dependencies
        working-directory: ./functions
        run: npm ci

      - name: Build functions
        working-directory: ./functions
        run: npm run build

      - name: Deploy Cloud Functions
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: w9jds/firebase-action@v13.0.1
        with:
          args: deploy --only functions
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: default

      # Note: Crashlytics symbols are typically uploaded during the EAS build step or via Gradle/Xcode phases.
      # If you are doing manual uploads via CI, you would use:
      # - name: Upload Crashlytics Mapping
      #   run: npx @react-native-firebase/crashlytics:upload
